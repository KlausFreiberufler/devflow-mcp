name: Release

# Validates a tag-push: version-sync, tag-matches-pkg, build is reproducible,
# tests pass, dist/ is committed. Then creates a GitHub release.
#
# npm publish runs LOCALLY from the maintainer's machine (`npm publish --access public`),
# not from CI. See CONTRIBUTING.md → Releasing. This avoids storing an npm token
# as a GitHub Action secret and keeps publish under direct human control.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Verify versions in sync (package.json, plugin.json, src/config/version.ts)
        run: npm run version:check

      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - run: npm run build

      - name: Verify committed dist/ matches build output
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ is out of date relative to src/. Run 'npm run build && git add dist/ && git commit' locally and re-push."
            git diff --stat dist/
            exit 1
          fi

      - run: npm test

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          body: |
            Published to npm: https://www.npmjs.com/package/@dev-flow-tech/mcp-server/v/${{ github.ref_name }}

            Install / update locally:
            ```
            claude plugin update devflow
            # or fresh:
            rm -rf ~/.claude/plugins/cache/devflow
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
