name: Release

# On a tag-push (v*): version-sync, tag-matches-pkg, build reproducible, tests pass,
# dist/ committed → then publishes to npm and creates the GitHub release.
#
# DF-434: npm publish now runs autonomously in CI via an npm *automation* token
# (secrets.NPM_TOKEN), which is exempt from 2FA/OTP — so there is no manual `--otp`
# step anymore. Set the token once:
#   npmjs.com → Access Tokens → Generate New Token → Automation
#   gh secret set NPM_TOKEN --repo KlausFreiberufler/devflow-mcp
# The publish step is idempotent — it skips if the version is already on npm.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Verify versions in sync (package.json, plugin.json, src/config/version.ts)
        run: npm run version:check

      - name: Verify tag matches package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - run: npm run build

      - name: Verify committed dist/ matches build output
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ is out of date relative to src/. Run 'npm run build && git add dist/ && git commit' locally and re-push."
            git diff --stat dist/
            exit 1
          fi

      - run: npm test

      - name: Publish to npm (idempotent — skips if version already published)
        run: |
          pkg="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          if npm view "$pkg@$ver" version >/dev/null 2>&1; then
            echo "$pkg@$ver is already on npm — skipping publish."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          body: |
            Published to npm: https://www.npmjs.com/package/@dev-flow-tech/mcp-server/v/${{ github.ref_name }}

            Install / update locally:
            ```
            claude plugin update devflow
            # or fresh:
            rm -rf ~/.claude/plugins/cache/devflow
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
