name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Verify versions in sync (package.json, plugin.json, src/config/version.ts)
        run: npm run version:check

      - run: npm run build

      - name: Verify committed dist/ matches build output
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ is out of date relative to src/. Run 'npm run build && git add dist/ && git commit' locally and re-push."
            git diff --stat dist/
            exit 1
          fi

      - name: Pack tarball
        run: npm pack

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Rename tarball for stable link
        run: cp devflow-mcp-${{ steps.version.outputs.version }}.tgz devflow-mcp-latest.tgz

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            devflow-mcp-${{ steps.version.outputs.version }}.tgz
            devflow-mcp-latest.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
